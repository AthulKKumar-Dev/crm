# ──────────────────────────────────────────────────────────────────────────────
# Docker Compose for the NestJS API server (server-only deployment).
#
# Use this on a DigitalOcean Droplet (or any single-host Docker setup) where
# the database and Redis are external. The frontend is deployed separately
# (Cloudflare Pages, etc.) and points at this API via FRONTEND_URL.
#
# Usage:
#   cp .env.example .env       # fill in real values
#   docker compose up -d --build
#   docker compose logs -f api
#   docker compose down
# ──────────────────────────────────────────────────────────────────────────────

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: collabo-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Pin PORT so it can't drift from Dockerfile's default (80).
      # Must match the ports + healthcheck below.
      PORT: "5000"
    ports:
      # BIND_HOST defaults to 0.0.0.0 for local dev (browser can reach container).
      # On the droplet, set BIND_HOST=127.0.0.1 in the environment before
      # `docker compose up` so the port is only reachable from localhost —
      # cloudflared (running on the host) proxies it publicly.
      - "${BIND_HOST:-0.0.0.0}:5000:5000"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5000/api/v1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
